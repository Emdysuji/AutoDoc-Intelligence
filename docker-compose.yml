version: '3.9'
services:
  api:
    build: .
    command: uvicorn autodoc.app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./storage:/app/storage
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A autodoc.tasks.processing_tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - ./:/app
      - ./storage:/app/storage
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: autodoc
      POSTGRES_USER: autodoc
      POSTGRES_PASSWORD: autodoc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
